name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret KEYSTORE_BASE64. Add the base64 of your release.jks to the repository secrets."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          test -s "$RUNNER_TEMP/signing/release.jks" || { echo "::error::Decoded keystore is empty."; exit 1; }

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/signing/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            eval "val=\$$v"
            if [ -z "$val" ]; then echo "::error::Missing secret $v"; exit 1; fi
          done
          ./gradlew assembleRelease

      - name: Prepare APK Artifact
        run: |
          mkdir -p dist
          BUILT=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$BUILT" ]; then
            echo "::error::No signed release APK produced. Are the signing secrets missing?"
            ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi
          cp "$BUILT" dist/TvAfrTools.apk
          # A release APK must be signed. With minSdk 28 the signature lives in the
          # APK Signing Block (v2/v3), not in META-INF/*.RSA — verify with apksigner.
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(ls -d "$SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          SIGNED=0
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            if "$APKSIGNER" verify --print-certs dist/TvAfrTools.apk; then SIGNED=1; fi
          elif grep -qa "APK Sig Block 42" dist/TvAfrTools.apk; then
            echo "apksigner not found — presence of APK Signing Block confirmed by magic."
            SIGNED=1
          fi
          if [ "$SIGNED" -ne 1 ]; then
            echo "::error::APK is not signed — refusing to publish."
            exit 1
          fi
          echo "APK signed OK: $(stat -c%s dist/TvAfrTools.apk) bytes"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TvAfrTools ${{ github.ref_name }}
          files: dist/TvAfrTools.apk
          generate_release_notes: true

      - name: Remove legacy duplicate APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Publish must succeed before removing the legacy attachment.
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > /tmp/release-assets.txt
          grep -Fxq "TvAfrTools.apk" /tmp/release-assets.txt
          for legacy in "app-release.apk" "TvAfrTools-${RELEASE_TAG}.apk"; do
            if grep -Fxq "$legacy" /tmp/release-assets.txt; then
              gh release delete-asset "$RELEASE_TAG" "$legacy" --yes
            fi
          done
