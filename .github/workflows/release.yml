name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Prepare APK Artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TvAfrTools-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TvAfrTools ${{ github.ref_name }}
          files: dist/TvAfrTools-${{ github.ref_name }}.apk
          generate_release_notes: true

      - name: Remove legacy duplicate APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Publish must succeed before removing the legacy attachment.
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > /tmp/release-assets.txt
          if grep -Fxq "app-release.apk" /tmp/release-assets.txt; then
            gh release delete-asset "$RELEASE_TAG" app-release.apk --yes
          fi
